name: Publish StudentLife PHP to Academic staging

on:
  push:
    branches: [main, develop, "codex/studentlife-preview", "codex/ai-*", "codex/communication-hub-preview"]
    paths:
      - "public/index.php"
      - "public/install.php"
      - "public/.htaccess"
      - "public/studentlife-sw.js"
      - "public/academic-intelligence.php"
      - "public/ai-learning-features.php"
      - "public/communication-hub.php"
      - "public/i18n.php"
      - "public/demo-seed-expansion.php"
      - ".github/deploy/**"
      - "tests/studentlife/**"
      - "docs/ADMIN_PHASE_1.md"
      - ".github/workflows/deploy-academic-staging.yml"
  pull_request:
    branches: [main, "codex/studentlife-preview"]
    paths:
      - "public/index.php"
      - "public/install.php"
      - "public/.htaccess"
      - "public/studentlife-sw.js"
      - "public/academic-intelligence.php"
      - "public/ai-learning-features.php"
      - "public/communication-hub.php"
      - "public/i18n.php"
      - ".github/deploy/**"
      - "tests/studentlife/**"
      - "docs/ADMIN_PHASE_1.md"
      - ".github/workflows/deploy-academic-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: studentlife_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, zip
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PHP syntax
        run: |
          php -l public/index.php
          php -l public/academic-intelligence.php
          php -l public/ai-learning-features.php
          php -l public/communication-hub.php
          php -l public/i18n.php
          php -l public/demo-seed-expansion.php
          php -l public/install.php
          php -l tests/studentlife/seed.php

      - name: Install Python test dependency
        run: pip install PyMySQL

      - name: Validate Python test syntax
        run: python -m py_compile tests/studentlife/acceptance.py

      - name: Seed isolated test database
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: studentlife_test
          TEST_DB_USER: root
          TEST_DB_PASS: root
        run: php tests/studentlife/seed.php

      - name: Start PHP test server
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/studentlife-php.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/studentlife-php.log
          exit 1

      - name: Run academic acceptance tests
        env:
          STUDENTLIFE_TEST_URL: http://127.0.0.1:8080
        run: python tests/studentlife/acceptance.py

      - name: Show PHP server log on failure
        if: failure()
        run: |
          if [ -f /tmp/studentlife-php.log ]; then cat /tmp/studentlife-php.log; else echo 'PHP server log was not created; inspect the earlier failing step.'; fi

  publish-php-staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate PHP entry point
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Check PHP syntax
        run: php -l public/index.php

      - name: Prepare staging payload
        run: |
          mkdir -p academic-staging
          cp public/index.php public/ai-learning-features.php public/academic-intelligence.php public/communication-hub.php public/i18n.php public/studentlife-sw.js academic-staging/
          test -s academic-staging/index.php
          test -s academic-staging/ai-learning-features.php
          test -s academic-staging/academic-intelligence.php
          test -s academic-staging/communication-hub.php
          test -s academic-staging/i18n.php
          test -s academic-staging/studentlife-sw.js

      - name: Publish only index.php to Academic homepage
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: academic-staging/
          server-dir: ./
          dangerous-clean-slate: false
          security: strict
          log-level: standard

  publish-php-preview:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/codex/studentlife-preview'
    needs: integration-tests
    runs-on: ubuntu-latest
    environment:
      name: studentlife-preview
      url: https://preview.studentlife.buildforge.com.ng/
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare preview payload
        run: |
          mkdir -p studentlife-preview
          mkdir -p .github/deploy
          cp public/index.php public/install.php public/studentlife-sw.js public/ai-learning-features.php public/academic-intelligence.php public/communication-hub.php public/i18n.php public/demo-seed-expansion.php studentlife-preview/
          cp public/.htaccess studentlife-preview/.htaccess
          cat .github/deploy/preview-cpanel-php-config.htaccess >> studentlife-preview/.htaccess
          test -s studentlife-preview/index.php
          test -s studentlife-preview/.htaccess
          test -s studentlife-preview/install.php
          test -s studentlife-preview/studentlife-sw.js
          test -s studentlife-preview/ai-learning-features.php
          test -s studentlife-preview/academic-intelligence.php
          test -s studentlife-preview/communication-hub.php
          test -s studentlife-preview/i18n.php
          test -s studentlife-preview/demo-seed-expansion.php

      - name: Publish PHP app to the isolated preview document root
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: server2.globalhosting247.com
          username: ${{ secrets.STUDENTLIFE_PREVIEW_FTP_USERNAME }}
          password: ${{ secrets.STUDENTLIFE_PREVIEW_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: studentlife-preview/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.well-known/**
            **/.user.ini
            **/php.ini
            **/config.php
            **/.ftpquota
            **/.ftp-deploy-sync-state.json
          security: strict
          log-level: standard
