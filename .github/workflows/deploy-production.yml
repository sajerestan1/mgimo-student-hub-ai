name: Deploy MGIMO Student Hub

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test the FTP connection and planned file changes without uploading"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Deploy over explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: dist/
          server-dir: ./
          # Every push is a safe connection/test run. A real upload is only
          # permitted when manually dispatched with dry_run=false.
          dry-run: ${{ github.event_name == 'push' || inputs.dry_run }}
          dangerous-clean-slate: false
          security: loose
          log-level: standard
