name: Student Hub production build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mgimo-student-hub-production
          path: dist/
          retention-days: 14
